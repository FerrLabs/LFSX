name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: The image build sees every workspace member
        run: |
          set -euo pipefail
          members=$(grep '^members = ' Cargo.toml | sed 's/.*= *\[//; s/\].*//' | tr -d '" ' | tr ',' ' ')
          missing=0
          for member in $members; do
            if ! grep -q "^COPY ${member} " Dockerfile; then
              echo "::error::${member} is a workspace member the Dockerfile never copies, so cargo cannot load the workspace"
              missing=1
            fi
          done
          echo "checked: ${members}"
          exit "$missing"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  bucket:
    # The stub the unit tests drive agrees with whatever it is sent, so it
    # cannot catch what a real implementation refuses. It missed an upload with
    # no Content-Length, which every push to a real bucket answered with a 500.
    name: Objects in a bucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Not a service container: MinIO needs a command, and services take an
      # image and an entrypoint override at best.
      - name: Start MinIO
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=lfsxkey             -e MINIO_ROOT_PASSWORD=lfsxsecret             quay.io/minio/minio:latest server /data
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              docker exec minio mc alias set local http://127.0.0.1:9000 lfsxkey lfsxsecret
              docker exec minio mc mb --ignore-existing local/lfsx-test
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          echo "::error::MinIO never came up"
          exit 1

      - run: cargo test --locked --test bucket
        env:
          LFSX_TEST_S3_ENDPOINT: http://127.0.0.1:9000

  e2e:
    # The audience is a studio: artists on Windows, programmers on macOS, CI on
    # Linux, and whatever git-lfs their tooling happened to bundle. One job on
    # one runner proved none of that.
    name: git-lfs ${{ matrix.lfs && matrix.lfs || 'bundled' }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
          # The floor this project claims to support. Locking settled in 3.0, and
          # the clients that ship inside Git for Windows, Sourcetree or Unity are
          # rarely the newest.
          - os: ubuntu-latest
            lfs: v3.0.2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Pin git-lfs ${{ matrix.lfs }}
        if: matrix.lfs
        run: |
          set -euo pipefail
          version="${{ matrix.lfs }}"
          curl -fsSL "https://github.com/git-lfs/git-lfs/releases/download/${version}/git-lfs-linux-amd64-${version}.tar.gz"             | tar xz -C "$RUNNER_TEMP"
          # 3.0 tarballs unpack flat; later ones nest under a directory. Take
          # whichever binary is there rather than guessing the shape.
          binary=$(find "$RUNNER_TEMP" -name git-lfs -type f | head -n1)
          chmod +x "$binary"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$binary" "$RUNNER_TEMP/bin/git-lfs"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: git lfs version
      - run: bash ci/e2e.sh

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - run: helm lint chart --set config.publicUrl=https://lfs.example.com

      - name: An unpinned public URL leaves the variable out
        run: |
          set -euo pipefail
          helm template lfsx chart > unpinned.yaml
          if grep -q 'LFSX_PUBLIC_URL' unpinned.yaml; then
            echo "::error::LFSX_PUBLIC_URL was set with nothing to pin it to"
            exit 1
          fi
          echo "no public URL pinned, the server answers on the requested host"

      - name: Render the shapes people actually deploy
        run: |
          set -euo pipefail

          helm template lfsx chart             --set config.publicUrl=https://lfs.example.com >/dev/null

          helm template lfsx chart             --set ingress.enabled=true             --set ingress.className=nginx             --set ingress.host=lfs.example.com > nginx.yaml

          grep -q 'proxy-body-size: "0"' nginx.yaml             || { echo "::error::nginx ingress lost its body size annotation, uploads over 1MB would fail"; exit 1; }
          grep -q 'https://lfs.example.com' nginx.yaml             || { echo "::error::LFSX_PUBLIC_URL was not derived from the ingress host"; exit 1; }

          helm template lfsx chart             --set config.publicUrl=http://lfsx.internal             --set auth.mode=disabled             --set persistence.existingClaim=objects >/dev/null
