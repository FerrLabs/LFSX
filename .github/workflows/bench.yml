name: Benchmark

on:
  pull_request:
    paths:
      - 'bench/**'
      - 'server/src/storage/**'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  throughput:
    name: Throughput
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Measure
        env:
          LARGE_MIB: '1024'
          SMALL_COUNT: '1000'
        run: |
          set -o pipefail
          bash bench/throughput.sh | tee "$GITHUB_STEP_SUMMARY"
