name: Benchmark

on:
  pull_request:
    paths:
      - 'bench/**'
      - 'server/src/storage/**'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  throughput:
    name: Throughput
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Measure
        env:
          LARGE_MIB: '1024'
          SMALL_COUNT: '1000'
        run: bash bench/throughput.sh | tee "$GITHUB_STEP_SUMMARY"
