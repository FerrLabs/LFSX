name: Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    # The site releases as `site@2026.8.18` and has nothing to publish here.
    # Without this, every site release fired this workflow against server
    # artefacts and failed.
    if: startsWith(github.event.release.tag_name, 'v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: lfsx-server
          target: ${{ matrix.target }}
          archive: lfsx-server-$target
          checksum: sha256
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: lfsx
          target: ${{ matrix.target }}
          archive: lfsx-$target
          checksum: sha256
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: The published binary runs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download and start it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'lfsx-server-x86_64-unknown-linux-musl.tar.gz' --dir .
          tar xzf lfsx-server-x86_64-unknown-linux-musl.tar.gz

          LFSX_BIND=127.0.0.1:8080 \
            LFSX_STORAGE_ROOT="$(mktemp -d)" \
            LFSX_AUTH=disabled \
            ./lfsx-server &
          server=$!

          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8080/health | grep -qx ok; then
              kill "$server"
              echo "the downloaded binary serves /health"
              exit 0
            fi
            sleep 1
          done

          kill "$server" 2>/dev/null || true
          echo "::error::the published binary never answered /health"
          exit 1

  npm:
    name: npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Publish the wrapper and its platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: bash cli/npm/scripts/publish.sh "${TAG#v}"
