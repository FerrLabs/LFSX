[workspace]
resolver = "2"
members = ["server", "cli"]
exclude = ["fuzz"]

[workspace.package]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.88"
authors = ["FerrLabs"]
repository = "https://github.com/FerrLabs/LFSX"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.13 renamed `rustls-tls` and made rustls default to aws-lc instead of ring.
# The provider is pinned back to ring, and the roots to the bundled Mozilla set,
# so this upgrade changes the version and nothing about how TLS is done: the
# release builds seven targets including two musl and two cross-compiled
# aarch64, and aws-lc wants a C toolchain at build time on exactly those.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "webpki-roots", "json", "blocking", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.23"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
prometheus = { version = "0.14", default-features = false }
sha2 = "0.11"
hex = "0.4"
futures-util = "0.3"
zstd = { version = "0.13", default-features = false }
chacha20poly1305 = "0.11"
blake3 = "1"
getrandom = "0.4"
rusty-s3 = "0.10"
thiserror = "2"
# rust_crypto rather than the aws-lc default for the same reason rustls pins
# ring: the release cross-compiles musl and aarch64 targets where aws-lc wants
# a C toolchain at build time.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
