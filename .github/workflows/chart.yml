name: Chart

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without v prefix)'
        required: true

permissions:
  contents: read
  packages: write
  # For the keyless chart signature: the OIDC token is the identity cosign
  # binds into the certificate, which is what lets anyone verify the chart
  # was pushed by this workflow rather than by someone with a stolen PAT.
  id-token: write

jobs:
  publish:
    name: Package & Push
    if: startsWith(github.event.release.tag_name, 'v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${RELEASE_TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin <<< "$GITHUB_TOKEN"
          # helm's login lands in helm's own config; cosign reads the Docker
          # one, so it logs in separately or the signature push is refused.
          cosign login ghcr.io -u "$REGISTRY_USER" --password-stdin <<< "$GITHUB_TOKEN"
          helm package chart --version "$VERSION" --app-version "$VERSION"
          helm push "lfsx-${VERSION}.tgz" oci://ghcr.io/ferrlabs/charts 2>&1 | tee push.log

          DIGEST=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::helm push printed no digest, so there is nothing to sign"
            exit 1
          fi

          cosign sign --yes "ghcr.io/ferrlabs/charts/lfsx@${DIGEST}"

          echo "Pushed and signed chart ${VERSION} at ${DIGEST}"

      # The metadata Artifact Hub reads to mark the listing as coming from the
      # publisher itself: the repositoryID it assigned, pushed as an OCI
      # artifact beside the chart under the tag it looks for. Re-pushed on
      # every release, which is idempotent and keeps it from going stale.
      - name: Claim the Artifact Hub listing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          oras login ghcr.io -u "$REGISTRY_USER" --password-stdin <<< "$GITHUB_TOKEN"
          cd chart
          oras push ghcr.io/ferrlabs/charts/lfsx:artifacthub.io             --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml             artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
