name: Docker

on:
  release:
    types: [published]
  # The image is built on release only, so a Dockerfile that stops linting or
  # building stays invisible until a version has been tagged and published
  # without one — which is how five releases went out with no image at all. A
  # change to the file now has to prove itself before it is merged.
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without v prefix)'
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  meta:
    name: Resolve build parameters
    if: startsWith(github.event.release.tag_name, 'v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      major_minor: ${{ steps.meta.outputs.major_minor }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          fi
          {
            echo "version=${VERSION}"
            echo "major_minor=$(echo "${VERSION}" | cut -d. -f1-2)"
            echo "ref=refs/tags/v${VERSION}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push LFSX
    needs: meta
    uses: FerrLabs/.github/.github/workflows/reusable-docker-build.yml@69be21ac9daf7eed64724fd7ec5eaf6a53e4aea7 # main
    with:
      image-name: ghcr.io/ferrlabs/lfsx
      tag: ${{ needs.meta.outputs.version }}
      ref: ${{ needs.meta.outputs.ref }}
      context: .
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      sccache-gha: true
      extra-tags: ghcr.io/ferrlabs/lfsx:${{ needs.meta.outputs.major_minor }}
      smoke-test-cmd: |
        podman run -d --name lfsx-smoke -p 18080:8080 "$SMOKE_IMAGE"
        trap 'podman logs lfsx-smoke; podman rm -f lfsx-smoke >/dev/null' EXIT
        for _ in $(seq 30); do
          if curl -fsS http://127.0.0.1:18080/health | grep -qx ok; then
            echo "health ok"
            exit 0
          fi
          sleep 1
        done
        echo "::error::the image never answered /health"
        exit 1

  verify:
    name: Build without publishing
    if: github.event_name == 'pull_request'
    uses: FerrLabs/.github/.github/workflows/reusable-docker-build.yml@69be21ac9daf7eed64724fd7ec5eaf6a53e4aea7 # main
    with:
      image-name: ghcr.io/ferrlabs/lfsx
      tag: pr-${{ github.event.pull_request.number }}
      context: .
      dockerfile: Dockerfile
      platforms: linux/amd64
      sccache-gha: true
      push: false
