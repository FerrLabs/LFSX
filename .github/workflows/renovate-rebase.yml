name: Renovate rebase now

on:
  pull_request:
    types: [edited]

# Nothing here reads or writes the repository: the reusable workflow asks the
# Renovate App for a rebase and needs nothing from this token. Declared anyway,
# because an undeclared block inherits whatever the repository default is.
permissions: {}

jobs:
  dispatch:
    uses: FerrLabs/.github/.github/workflows/reusable-renovate-dispatch.yml@539e9aca37e08abde8d9cefbe13cd98fa62b1b41 # main
    with:
      runner: ubuntu-latest
    secrets: inherit
