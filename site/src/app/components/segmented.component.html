<div class="segmented" role="group" [attr.aria-label]="label()" translate="no">
  @for (option of options(); track option.key) {
    <button
      class="segmented__option"
      type="button"
      [attr.aria-pressed]="option.key === value()"
      (click)="value.set(option.key)"
    >
      {{ option.label }}
    </button>
  }
</div>
