name: Chart

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without v prefix)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Package & Push
    if: startsWith(github.event.release.tag_name, 'v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4

      - id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"

          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$GITHUB_TOKEN"
          helm package chart --version "$VERSION" --app-version "$VERSION"
          helm push "lfsx-${VERSION}.tgz" oci://ghcr.io/ferrlabs/charts

          echo "Pushed chart ${VERSION} to ghcr.io/ferrlabs/charts/lfsx"
