name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets + CVE
    # The SARIF upload is the only thing here that writes anything.
    permissions:
      contents: read
      security-events: write
    uses: FerrLabs/.github/.github/workflows/reusable-security-scan.yml@c4121e79b9e15551efce374b7e9f4990667b9a36 # main
    secrets: inherit
