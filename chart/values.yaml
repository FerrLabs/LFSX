image:
  repository: ghcr.io/ferrlabs/lfsx
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  publicUrl: ""
  logLevel: info

auth:
  mode: github
  githubApiUrl: https://api.github.com
  gitlabApiUrl: https://gitlab.com/api/v4
  cacheTtl: 60
  rejectionTtl: 10

gc:
  grace: 1209600

locks:
  # Seconds a lock may go untouched before anyone can take it. Empty means
  # never, which is the behaviour from before this existed.
  maxAge: ""

limits:
  maxObjectSize: ""
  repoQuota: ""

compression: ""

encryption:
  # Name of an existing Secret holding the key file. The chart never takes the
  # key itself: a Helm value ends up in the release secret and in whatever CI
  # printed the command.
  existingSecret: ""
  key: key

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  size: 100Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "8080"
nodeSelector: {}
tolerations: []
affinity: {}
