name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  e2e:
    name: git-lfs end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock') }}

      - run: git lfs version
      - run: bash ci/e2e.sh

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4

      - run: helm lint chart --set config.publicUrl=https://lfs.example.com

      - name: The public URL cannot be left unset
        run: |
          if helm template lfsx chart >/dev/null 2>&1; then
            echo "::error::rendering succeeded without config.publicUrl or an ingress host"
            exit 1
          fi

      - name: Render the shapes people actually deploy
        run: |
          set -euo pipefail

          helm template lfsx chart             --set config.publicUrl=https://lfs.example.com >/dev/null

          helm template lfsx chart             --set ingress.enabled=true             --set ingress.className=nginx             --set ingress.host=lfs.example.com > nginx.yaml

          grep -q 'proxy-body-size: "0"' nginx.yaml             || { echo "::error::nginx ingress lost its body size annotation, uploads over 1MB would fail"; exit 1; }
          grep -q 'https://lfs.example.com' nginx.yaml             || { echo "::error::LFSX_PUBLIC_URL was not derived from the ingress host"; exit 1; }

          helm template lfsx chart             --set config.publicUrl=http://lfsx.internal             --set auth.mode=disabled             --set persistence.existingClaim=objects >/dev/null
