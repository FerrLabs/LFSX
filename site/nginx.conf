server {
    listen 8080;
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;
    root /usr/share/nginx/html;

    error_page 404 /404/index.html;

    # Prerendered pages live in per-slug directories, so an intermediate path
    # like /docs/ is a real directory with no index.html. try_files resolves it,
    # finds no index, and nginx answers 403 before error_page 404 can run — a
    # bare Forbidden instead of the styled page. Serve the 404 for those too.
    error_page 403 =404 /404/index.html;

    location = /docs { return 301 /docs/quickstart/; }
    location = /docs/ { return 301 /docs/quickstart/; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(woff2?|ttf|eot|otf|png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }
}
