name: Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    # The site releases as `site@2026.8.18` and has nothing to publish here.
    # Without this, every site release fired this workflow against server
    # artefacts and failed.
    if: startsWith(github.event.release.tag_name, 'v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # For the provenance attestation: the OIDC token proves which workflow
      # built the archive, and the attestation stores that proof where
      # `gh attestation verify` finds it.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: lfsx-server
          target: ${{ matrix.target }}
          archive: lfsx-server-$target
          checksum: sha256
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: lfsx
          target: ${{ matrix.target }}
          archive: lfsx-$target
          checksum: sha256
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # The archives stay in the workspace after they are uploaded, which is
      # what lets them be attested as built. The checksum next to an asset
      # proves the download survived the wire; the attestation is what ties
      # the bytes to this repository's workflow and this commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            lfsx-server-${{ matrix.target }}.tar.gz
            lfsx-server-${{ matrix.target }}.zip
            lfsx-${{ matrix.target }}.tar.gz
            lfsx-${{ matrix.target }}.zip

  sbom:
    name: SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate and attach the SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          cargo cyclonedx --format json --describe crate
          mv server/lfsx-server.cdx.json lfsx-server.cdx.json
          mv cli/lfsx.cdx.json lfsx.cdx.json

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber lfsx-server.cdx.json lfsx.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            lfsx-server.cdx.json
            lfsx.cdx.json

  verify:
    name: The published binary runs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download and start it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'lfsx-server-x86_64-unknown-linux-musl.tar.gz' --dir .
          tar xzf lfsx-server-x86_64-unknown-linux-musl.tar.gz

          LFSX_BIND=127.0.0.1:8080 \
            LFSX_STORAGE_ROOT="$(mktemp -d)" \
            LFSX_AUTH=disabled \
            ./lfsx-server &
          server=$!

          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8080/health | grep -qx ok; then
              kill "$server"
              echo "the downloaded binary serves /health"
              exit 0
            fi
            sleep 1
          done

          kill "$server" 2>/dev/null || true
          echo "::error::the published binary never answered /health"
          exit 1

  npm:
    name: npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What npm exchanges for a publish. Nothing long-lived is involved, which
      # is the point: the NPM_TOKEN this replaces expired after ninety days and
      # took six releases with it before anybody noticed.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      # Pinned rather than inherited from the runner image: trusted publishing
      # needs npm 11.5.1 or newer, and the image's version is not ours to
      # promise. No registry-url here, which would write an .npmrc expecting a
      # token and defeat the exchange.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Publish the wrapper and its platform packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: bash cli/npm/scripts/publish.sh "${TAG#v}"
