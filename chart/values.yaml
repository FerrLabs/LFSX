replicaCount: 1

storage:
  type: local
  s3:
    endpoint: ""
    bucket: ""
    region: us-east-1
    pathStyle: true
    presign: false
    # A local copy of what the bucket serves, so a second reader does not pay
    # the round trip again. Both together or neither: a cache with no ceiling
    # fills the volume this server also stages uploads on.
    cacheDir: ""
    cacheMaxBytes: ""
    existingSecret: ""
    accessKeyKey: accessKey
    secretKeyKey: secretKey

image:
  repository: ghcr.io/ferrlabs/lfsx
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  publicUrl: ""
  logLevel: info
  # HTTP traces URL of an OTLP collector, http://collector:4318/v1/traces.
  # Empty keeps traces off entirely.
  otlpEndpoint: ""

auth:
  mode: github
  # Resolve a request with no credentials against the forge, so a repository it
  # serves publicly can be cloned without a token. Off by default: it costs you
  # the bandwidth of anyone who finds the endpoint. Set true to open it.
  anonymousRead: false
  # Repositories whose objects take write access to read, so a public repository
  # can keep its assets to whoever could push them. Entries are org/repo,
  # org/prefix-* or org/*. Empty serves every repository what the forge grants.
  restricted: []
  githubApiUrl: https://api.github.com
  gitlabApiUrl: https://gitlab.com/api/v4
  # No default on purpose: Gitea and Forgejo have no canonical host, every
  # instance is self-hosted. Point it at your API root, https://git.example.com/api/v1.
  giteaApiUrl: ""
  # A GitHub App identity for the server's own anonymous lookups: the App id,
  # and a Secret holding the App's RSA private key. The chart never takes the
  # key itself, same reason as the encryption key.
  githubApp:
    appId: ""
    existingSecret: ""
    key: private-key.pem
  cacheTtl: 60
  rejectionTtl: 10
  # Forge lookups a minute the server will spend, counting only what the caches
  # could not answer. 0 removes the ceiling.
  lookupBudget: 600

gc:
  grace: 1209600
  # Seconds before an interrupted upload's leftovers are reclaimed, on the
  # volume and in the bucket.
  stagingMaxAge: 86400

locks:
  # Seconds a lock may go untouched before anyone can take it. Empty means
  # never, which is the behaviour from before this existed.
  maxAge: ""

limits:
  maxObjectSize: ""
  repoQuota: ""
  maxConcurrentTransfers: ""

compression: ""

encryption:
  # Name of an existing Secret holding the key file. The chart never takes the
  # key itself: a Helm value ends up in the release secret and in whatever CI
  # printed the command.
  # There is no LFSX_ENCRYPTION_KEY_COMMAND here on purpose: it runs through a
  # shell and the image carries none. Reach a KMS through a CSI driver or an
  # init container that fills this Secret instead.
  existingSecret: ""
  key: key

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  size: 100Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 256Mi
  limits:
    memory: 512Mi
    ephemeral-storage: 2Gi

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "8080"
nodeSelector: {}
tolerations: []
affinity: {}
