<header class="header">
  <div class="header__inner">
    <a class="header__brand" href="/" aria-label="LFSX">
      <svg class="header__mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="2" y="2" width="30" height="30" fill="none" stroke="currentColor" stroke-width="4" />
        <rect x="8" y="8" width="9" height="9" fill="currentColor" />
        <rect x="20" y="8" width="9" height="9" fill="currentColor" />
        <rect x="8" y="20" width="9" height="9" fill="currentColor" />
        <rect x="20" y="20" width="9" height="9" fill="var(--logo-alt, currentColor)" />
      </svg>
      <span class="header__wordmark" translate="no">LFS<span class="header__x">X</span></span>
    </a>

    <nav class="header__nav">
      @for (section of sections; track section.key) {
        <a class="header__link header__link--section" [href]="section.href">{{ section.label }}</a>
      }
      <a class="header__link" href="/docs/quickstart" i18n="@@nav.docs">Docs</a>
      <a
        class="header__link header__link--strong"
        href="https://github.com/FerrLabs/LFSX"
        rel="noreferrer noopener"
        translate="no"
        >GitHub</a
      >
    </nav>
  </div>
</header>
