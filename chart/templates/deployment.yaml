{{- include "lfsx.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lfsx.fullname" . }}
  labels:
    {{- include "lfsx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if eq .Values.storage.type "s3" }}
    type: RollingUpdate
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "lfsx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lfsx.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lfsx.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lfsx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: LFSX_BIND
              value: "0.0.0.0:8080"
            - name: LFSX_STORAGE_ROOT
              value: /var/lib/lfsx
            {{- if eq .Values.storage.type "s3" }}
            - name: LFSX_STORAGE
              value: s3
            - name: LFSX_S3_ENDPOINT
              value: {{ .Values.storage.s3.endpoint | quote }}
            - name: LFSX_S3_BUCKET
              value: {{ .Values.storage.s3.bucket | quote }}
            - name: LFSX_S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            - name: LFSX_S3_PATH_STYLE
              value: {{ .Values.storage.s3.pathStyle | quote }}
            - name: LFSX_S3_PRESIGN
              value: {{ .Values.storage.s3.presign | quote }}
            - name: LFSX_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret }}
                  key: {{ .Values.storage.s3.accessKeyKey }}
            - name: LFSX_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret }}
                  key: {{ .Values.storage.s3.secretKeyKey }}
            {{- end }}
            {{- with (include "lfsx.publicUrl" .) }}
            - name: LFSX_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            - name: LFSX_AUTH
              value: {{ .Values.auth.mode | quote }}
            {{- if ne .Values.auth.mode "disabled" }}
            {{- if eq .Values.auth.mode "gitlab" }}
            - name: LFSX_GITLAB_API_URL
              value: {{ .Values.auth.gitlabApiUrl | quote }}
            {{- else }}
            - name: LFSX_GITHUB_API_URL
              value: {{ .Values.auth.githubApiUrl | quote }}
            {{- end }}
            - name: LFSX_ANONYMOUS_READ
              value: {{ .Values.auth.anonymousRead | quote }}
            - name: LFSX_AUTH_CACHE_TTL
              value: {{ .Values.auth.cacheTtl | quote }}
            - name: LFSX_AUTH_REJECTION_TTL
              value: {{ .Values.auth.rejectionTtl | quote }}
            {{- end }}
            - name: LFSX_GC_GRACE
              value: {{ .Values.gc.grace | quote }}
            {{- with .Values.limits.maxObjectSize }}
            - name: LFSX_MAX_OBJECT_SIZE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.limits.repoQuota }}
            - name: LFSX_REPO_QUOTA
              value: {{ . | quote }}
            {{- end }}
            {{- if ne (.Values.limits.maxConcurrentTransfers | toString) "" }}
            - name: LFSX_MAX_CONCURRENT_TRANSFERS
              value: {{ .Values.limits.maxConcurrentTransfers | quote }}
            {{- end }}
            {{- with .Values.locks.maxAge }}
            - name: LFSX_LOCK_MAX_AGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.compression }}
            - name: LFSX_COMPRESSION
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.encryption.existingSecret }}
            - name: LFSX_ENCRYPTION_KEY_FILE
              value: /etc/lfsx/keys/{{ .Values.encryption.key }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: objects
              mountPath: /var/lib/lfsx
            {{- if .Values.encryption.existingSecret }}
            - name: encryption-key
              mountPath: /etc/lfsx/keys
              readOnly: true
            {{- end }}
      volumes:
        - name: objects
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "lfsx.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.encryption.existingSecret }}
        - name: encryption-key
          secret:
            secretName: {{ .Values.encryption.existingSecret }}
            # 0440, not 0400. A projected secret is owned by root, and fsGroup
            # gives the group to 65532, the user this runs as. Owner-only read
            # looks tighter and leaves the server unable to open its own key.
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
